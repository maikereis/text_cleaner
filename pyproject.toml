[project]
name = "text-cleaner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maike Reis", email = "maikerdralcantara@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=6.1.0",
    "pre-commit>=4.3.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=8.4.2",
]

[tool.isort]
profile = "black"
